; Firmware ESP32 – Đồ án 2 nhà thông minh
; Mỗi bài test linh kiện là 1 env, chọn env ở thanh trạng thái PlatformIO (dưới cùng VS Code)
; rồi bấm Upload (→) và Serial Monitor (ổ cắm).

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
upload_speed = 921600

; ---------- Test từng linh kiện ----------
[env:t00_esp32]
build_src_filter = +<test/t00_esp32.cpp>

[env:t02_dht22]
build_src_filter = +<test/t02_dht22.cpp>
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14

[env:t03_buttons]
build_src_filter = +<test/t03_buttons.cpp>

[env:t04_pir]
build_src_filter = +<test/t04_pir.cpp>

[env:t05_bh1750]
build_src_filter = +<test/t05_bh1750.cpp>
lib_deps =
  claws/BH1750@^1.3.0

[env:t06_lcd]
build_src_filter = +<test/t06_lcd.cpp>
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:t08_relay_fan]
build_src_filter = +<test/t08_relay_fan.cpp>

[env:t09_relay_led]
build_src_filter = +<test/t09_relay_led.cpp>

; ---------- Demo ----------
; Node phòng khách: PIR bật đèn + quạt (tắt sau 30s), LCD nhiệt độ/độ ẩm + ID node, nút SET tăng ID 1→10
[env:demo_phong_khach]
build_src_filter = +<demo/demo_phong_khach.cpp>
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
